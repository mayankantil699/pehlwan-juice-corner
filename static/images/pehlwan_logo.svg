<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="plg_gold_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="20%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="plg_gold_light" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="plg_citrus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="plg_leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Deep Luxury Royal Background -->
    <radialGradient id="plg_dark_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241B08" />
      <stop offset="65%" stop-color="#120E05" />
      <stop offset="100%" stop-color="#060502" />
    </radialGradient>

    <filter id="plg_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Shadow & Base -->
  <circle cx="120" cy="120" r="114" fill="#050402" stroke="url(#plg_gold_rim)" stroke-width="2.5" />
  <circle cx="120" cy="120" r="109" fill="url(#plg_dark_bg)" stroke="url(#plg_gold_rim)" stroke-width="1" />

  <!-- Dotted Ornate Ring -->
  <circle cx="120" cy="120" r="103" stroke="url(#plg_gold_rim)" stroke-width="1.2" stroke-dasharray="3 3.5" opacity="0.85" />

  <!-- 8 Decorative Stars around the rim -->
  <g fill="url(#plg_gold_light)" opacity="0.9">
    <polygon points="120,20 122,24 126,24 123,27 124,31 120,28 116,31 117,27 114,24 118,24" />
    <polygon points="50,49 52,53 56,53 53,56 54,60 50,57 46,60 47,56 44,53 48,53" transform="scale(0.8) translate(12,12)" />
    <polygon points="190,49 192,53 196,53 193,56 194,60 190,57 186,60 187,56 184,53 188,53" transform="scale(0.8) translate(48,12)" />
    <polygon points="25,120 27,123 30,123 28,125 29,128 25,126 21,128 22,125 20,123 23,123" />
    <polygon points="215,120 217,123 220,123 218,125 219,128 215,126 211,128 212,125 210,123 213,123" />
  </g>

  <!-- Top Crown / Royal Crest -->
  <g filter="url(#plg_glow)">
    <path d="M102,46 L108,54 L120,40 L132,54 L138,46 L135,60 L105,60 Z" fill="url(#plg_gold_rim)" />
    <circle cx="120" cy="38" r="2.5" fill="#FFFBEB" />
    <circle cx="102" cy="44" r="1.8" fill="#FFFBEB" />
    <circle cx="138" cy="44" r="1.8" fill="#FFFBEB" />
  </g>

  <!-- Laurel Wreath Leaves (Left & Right) -->
  <g fill="url(#plg_gold_rim)" opacity="0.75">
    <!-- Left Leaves -->
    <path d="M48,95 C42,85 45,72 55,65 C53,73 53,82 58,90 Z" />
    <path d="M42,120 C36,110 37,98 47,90 C46,98 47,107 53,115 Z" />
    <path d="M44,145 C38,135 39,122 49,115 C48,123 49,132 55,140 Z" />
    <path d="M54,168 C48,160 48,148 57,140 C57,148 59,156 66,162 Z" />
    <!-- Right Leaves -->
    <path d="M192,95 C198,85 195,72 185,65 C187,73 187,82 182,90 Z" />
    <path d="M198,120 C204,110 203,98 193,90 C194,98 193,107 187,115 Z" />
    <path d="M196,145 C202,135 201,122 191,115 C192,123 191,132 185,140 Z" />
    <path d="M186,168 C192,160 192,148 183,140 C183,148 181,156 174,162 Z" />
  </g>

  <!-- Centerpiece: Powerful Muscular Pehlwan / Wrestler Silhouette -->
  <!-- Pehlwan Torso, Broad Shoulders & Powerful Arms -->
  <g fill="url(#plg_gold_light)" filter="url(#plg_glow)">
    <!-- Head & Strong Neck -->
    <circle cx="120" cy="74" r="10" />
    <!-- Traditional Akhada Langot Knot / Top Knot -->
    <ellipse cx="120" cy="62" rx="3.5" ry="2.5" />
    
    <!-- Muscular Neck & Traps -->
    <path d="M112,80 L110,88 L130,88 L128,80 Z" />
    
    <!-- Chest (Pecs) & Powerful Shoulders -->
    <path d="M96,90 C90,92 82,98 80,108 C78,118 84,124 90,126 C93,120 96,112 101,107 C107,116 114,117 120,117 C126,117 133,116 139,107 C144,112 147,120 150,126 C156,124 162,118 160,108 C158,98 150,92 144,90 C136,87 128,87 120,87 C112,87 104,87 96,90 Z" />
    
    <!-- Left Bicep & Forearm (Double Bicep Power Flex) -->
    <path d="M80,108 C72,106 65,99 64,88 C63,80 69,74 76,77 C82,79 84,87 87,93 C89,98 94,101 96,90 C92,85 86,72 75,69 C63,65 52,75 54,90 C56,104 67,116 80,116 Z" />
    
    <!-- Right Bicep & Forearm (Double Bicep Power Flex) -->
    <path d="M160,108 C168,106 175,99 176,88 C177,80 171,74 164,77 C158,79 156,87 153,93 C151,98 146,101 144,90 C148,85 154,72 165,69 C177,65 188,75 186,90 C184,104 173,116 160,116 Z" />

    <!-- Abs & Core (Six Pack) -->
    <path d="M106,116 L108,136 L132,136 L134,116 C129,118 124,119 120,119 C116,119 111,118 106,116 Z" opacity="0.95" />
    <!-- Muscle Definition Lines -->
    <line x1="120" y1="92" x2="120" y2="134" stroke="#120E05" stroke-width="2" />
    <line x1="110" y1="122" x2="130" y2="122" stroke="#120E05" stroke-width="1.5" />
    <line x1="111" y1="129" x2="129" y2="129" stroke="#120E05" stroke-width="1.5" />
  </g>

  <!-- Traditional Gada (Mace) / Power Symbol Behind -->
  <g fill="url(#plg_gold_rim)" opacity="0.6">
    <path d="M117,54 L123,54 L122,86 L118,86 Z" />
  </g>

  <!-- Citrus Fruit Slice & Fresh Juice Splash Motif (Foreground Base) -->
  <g transform="translate(0, 10)">
    <!-- Fresh Citrus Wheel (Orange / Mosambi Wheel) -->
    <circle cx="120" cy="148" r="22" fill="url(#plg_citrus)" stroke="#FFFBEB" stroke-width="2" />
    <circle cx="120" cy="148" r="19" fill="#181206" />
    
    <!-- Citrus Segments -->
    <g fill="url(#plg_citrus)">
      <path d="M120,146 L120,132 A16,16 0 0,1 131,136 Z" />
      <path d="M122,148 L136,148 A16,16 0 0,1 133,159 Z" />
      <path d="M120,150 L120,164 A16,16 0 0,1 109,160 Z" />
      <path d="M118,148 L104,148 A16,16 0 0,1 107,137 Z" />
      <path d="M121.5,147 L132.5,138.5 A16,16 0 0,1 136,145.5 Z" />
      <path d="M121.5,149 L131,159 A16,16 0 0,1 123,163 Z" />
      <path d="M118.5,149 L109,159 A16,16 0 0,1 104.5,152 Z" />
      <path d="M118.5,147 L107.5,138.5 A16,16 0 0,1 116,133 Z" />
    </g>
    <circle cx="120" cy="148" r="3" fill="#FFFBEB" />

    <!-- Green Fresh Mint / Botanical Leaves -->
    <path d="M138,136 C148,130 156,134 158,142 C150,146 142,142 138,136 Z" fill="url(#plg_leaf)" />
    <path d="M102,136 C92,130 84,134 82,142 C90,146 98,142 102,136 Z" fill="url(#plg_leaf)" />

    <!-- Glistening Pure Droplets -->
    <circle cx="148" cy="148" r="2.2" fill="#FEF08A" opacity="0.9" />
    <circle cx="92" cy="148" r="2.2" fill="#FEF08A" opacity="0.9" />
    <circle cx="120" cy="122" r="2" fill="#FEF08A" opacity="0.8" />
  </g>

  <!-- Elegant Bottom Royal Ribbon Banner -->
  <g filter="url(#plg_glow)">
    <!-- Ribbon Fold Ends -->
    <polygon points="36,182 52,175 52,192 36,198 42,190" fill="#78350F" />
    <polygon points="204,182 188,175 188,192 204,198 198,190" fill="#78350F" />
    
    <!-- Main Ribbon Plaque -->
    <path d="M48,174 L192,174 C198,174 202,178 200,186 L196,194 C194,198 190,201 184,201 L56,201 C50,201 46,198 44,194 L40,186 C38,178 42,174 48,174 Z" fill="url(#plg_gold_rim)" stroke="#FFFBEB" stroke-width="1.2" />
    
    <!-- Ribbon Inner Line -->
    <path d="M52,177 L188,177 C192,177 195,179 194,184 L191,191 C190,194 187,197 182,197 L58,197 C53,197 50,194 49,191 L46,184 C45,179 48,177 52,177 Z" fill="#140F04" />
  </g>

  <!-- Banner Typography: PEHLWAN JUICE CORNER -->
  <text x="120" y="188" text-anchor="middle" fill="url(#plg_gold_light)" font-family="'Cinzel', serif, Georgia" font-size="10.5" font-weight="900" letter-spacing="2.8">PEHLWAN</text>
  <text x="120" y="196" text-anchor="middle" fill="#FDE68A" font-family="'Cinzel', serif, Georgia" font-size="6.5" font-weight="800" letter-spacing="3.2">JUICE CORNER</text>

  <!-- Subtitle Tag: 100% PURE & NUTRITION -->
  <text x="120" y="215" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="700" letter-spacing="2">ISRANA • 100% PURE</text>
</svg>
